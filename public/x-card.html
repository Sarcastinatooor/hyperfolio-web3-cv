<link rel="preconnect" href="https://fonts.googleapis.com">

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;700;800&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: transparent;
    --card: #000000;
    --line: #2F3336;
    --text: #E7E9EA;
    --muted: #71767B;
    --blue: #1D9BF0;
    --violet: #A78BFA;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { background: var(--bg); }
  body {
    font-family: Inter, -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    padding: 12px;
    display: flex;
    justify-content: center;
  }
  a.card {
    display: block;
    width: 100%;
    max-width: 640px;
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: 18px;
    overflow: hidden;
    color: var(--text);
    text-decoration: none;
    transition: border-color .2s ease, transform .2s ease;
  }
  a.card:hover { border-color: #536471; transform: translateY(-1px); }
  .banner {
    height: 120px;
    background:
      radial-gradient(120% 140% at 0% 0%, #8B5CF6 0%, transparent 55%),
      radial-gradient(90% 120% at 100% 100%, #FFD54B 0%, transparent 50%),
      linear-gradient(135deg, #1a1033 0%, #0b0b12 100%);
    position: relative;
  }
  .xmark {
    position: absolute; top: 14px; right: 16px;
    width: 22px; height: 22px; fill: #fff; opacity: .9;
  }
  .body { padding: 0 20px 18px; position: relative; }
  .avatar {
    width: 92px; height: 92px; border-radius: 50%;
    border: 4px solid var(--card);
    background: #16181C;
    margin-top: -46px;
    object-fit: cover;
    display: block;
  }
  .follow {
    position: absolute; right: 20px; top: 14px;
    background: #EFF3F4; color: #0F1419;
    font-weight: 700; font-size: 14px;
    padding: 8px 18px; border-radius: 999px;
  }
  .name {
    margin-top: 10px;
    font-size: 20px; font-weight: 800; line-height: 1.2;
    display: flex; align-items: center; gap: 6px; flex-wrap: wrap;
  }
  .badge { width: 19px; height: 19px; fill: var(--blue); flex: none; }
  .flag { width: 18px; height: 18px; flex: none; }
  .handle { color: var(--muted); font-size: 15px; margin-top: 2px; }
  .bio { margin-top: 12px; font-size: 15px; line-height: 1.45; }
  .bio .m { color: var(--violet); }
  .stats { margin-top: 12px; display: flex; gap: 20px; font-size: 15px; color: var(--muted); }
  .stats b { color: var(--text); font-weight: 700; }
  @media (max-width: 420px) {
    body { padding: 8px; }
    .banner { height: 90px; }
    .avatar { width: 76px; height: 76px; margin-top: -38px; }
    .follow { top: 10px; padding: 6px 14px; font-size: 13px; }
    .name { font-size: 18px; }
  }
</style>
</head>
